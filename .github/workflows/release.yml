name: Jodit Angular

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish (leave empty to only run tests)
        required: false
        default: ''

  push:
    branches: [main]
    tags: ['*']

  pull_request:

permissions:
  id-token: write # Required for npm OIDC trusted publishing
  contents: write # Required to create the GitHub release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build library
        run: npm run build

      - name: Build demo
        run: npm run build:demo

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || inputs.ref != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x
      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./projects/jodit-angular/package.json').version")
          TAG="${{ inputs.ref || github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match library version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish ./dist/jodit-angular --access public

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          NOTES=$(awk "/^## ${VERSION}/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.NOTES }}
          generate_release_notes: true

      - name: Summary
        run: echo "[jodit-angular ${{ steps.version.outputs.version }} on npm](https://www.npmjs.com/package/jodit-angular/v/${{ steps.version.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"
